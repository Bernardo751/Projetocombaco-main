<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Usuários • Estúdio</title>
    <link href="css/vendor/bootstrap.min.css" rel="stylesheet" />
    <link href="css/atelier.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="dashboard.html">Estúdio de Tatuagem</a
        ><button data-logout class="btn btn-outline-light">Sair</button>
      </div>
    </nav>
    <main class="container py-5" style="max-width: 650px">
      <h1 class="h2">Cadastrar usuário da equipe</h1>
      <p>Somente administradores podem criar contas.</p>
      <p id="aviso" class="text-danger" role="alert"></p>
      <p id="sucesso" class="text-success" role="status"></p>
      <!-- Formulário da funcionalidade desta página -->
      <form id="form-cadastro" class="card card-body gap-3">
        <label
          >Nome<input
            id="nome"
            class="form-control"
            required
            minlength="2" /></label
        ><label
          >E-mail<input
            id="email"
            class="form-control"
            type="email"
            required /></label
        ><label
          >Senha<input
            id="senha"
            class="form-control"
            type="password"
            required
            minlength="10"
            maxlength="72" /></label
        ><label
          >Tipo<select id="tipo" class="form-select">
            <option value="funcionario">Funcionário</option>
            <option value="admin">Administrador</option>
          </select></label
        ><button type="submit" class="btn btn-primary">Criar conta</button>
      </form>
    </main>
    <!-- Carrega os scripts compartilhados antes da lógica desta tela -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cadastro.js"></script>
  </body>
</html>

<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Painel • Estúdio</title>
    <link href="css/vendor/bootstrap.min.css" rel="stylesheet" />
    <link href="css/atelier.css" rel="stylesheet" />

  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="dashboard.html">Estúdio de Tatuagem</a
        ><button data-logout class="btn btn-outline-light">Sair</button>

    </nav>

      <h1 class="mb-4">O que você precisa gerenciar?</h1>
      <div class="row g-3">
        <div class="col-md-4">
          <a
            class="card card-body h-100 text-decoration-none"
            href="clientes.html"
            ><h2 class="h5">Clientes</h2>
            <span>Cadastros e contatos</span></a
          >
        </div>
        <div class="col-md-4">
          <a
            class="card card-body h-100 text-decoration-none"
            href="tatuadores.html"
            ><h2 class="h5">Tatuadores</h2>

        </div>
        <div class="col-md-4">

            ><h2 class="h5">Senioridade</h2>

          >
        </div>
        <div class="col-md-4">
          <a
            class="card card-body h-100 text-decoration-none"
            href="estilos.html"

            <span>Catálogo de tatuagem</span></a
          >
        </div>
        <div class="col-md-4" id="admin-card">
          <a
            class="card card-body h-100 text-decoration-none"
            href="cadastro.html"
            ><h2 class="h5">Usuários</h2>
            <span>Criar contas de equipe</span></a
          >
        </div>
      </div>
      <p id="aviso" class="text-danger mt-3"></p>

    <!-- Carrega os scripts compartilhados antes da lógica desta tela -->
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>

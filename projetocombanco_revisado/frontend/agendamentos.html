<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Agendamentos • Estúdio</title>
    <link href="css/vendor/bootstrap.min.css" rel="stylesheet" />
    <link href="css/atelier.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="dashboard.html">Estúdio</a>
        <div>
          <a class="btn btn-sm btn-outline-light" href="dashboard.html"
            >Painel</a
          >
          <a class="btn btn-sm btn-outline-light" href="clientes.html"
            >Clientes</a
          >
          <a class="btn btn-sm btn-outline-light" href="senioridade.html"
            >Senioridade</a
          >
          <a class="btn btn-sm btn-outline-light" href="estilos.html"
            >Estilos</a
          >
          <a class="btn btn-sm btn-outline-light" href="tatuadores.html"
            >Tatuadores</a
          >
          <a class="btn btn-sm btn-outline-light" href="agendamentos.html"
            >Agendamentos</a
          >
          <button data-logout class="btn btn-sm btn-outline-light">Sair</button>
        </div>
      </div>
    </nav>
    <main class="container py-4">
      <h1>Agendamentos</h1>
      <p id="aviso" class="text-danger" role="alert"></p>
      <!-- Formulário da funcionalidade desta página -->
      <form id="form" class="row g-2 mb-4">
        <label
          >Cliente<select
            id="idcliente"
            class="form-select"
            required
          ></select></label
        ><label
          >Tatuador<select
            id="idtatuador"
            class="form-select"
            required
          ></select></label
        ><label
          >Data<input
            id="dataagendamento"
            class="form-control"
            type="date"
            required /></label
        ><label
          >Hora<input
            id="horaagendamento"
            class="form-control"
            type="time"
            required /></label
        ><label
          >Descrição<textarea
            id="descricaotatuagem"
            class="form-control"
          ></textarea></label
        ><label
          >Valor<input
            id="valortatuagem"
            class="form-control"
            type="number"
            min="0"
            step="0.01" /></label
        ><label id="bloco-status" hidden
          >Status<select id="status" class="form-select">
            <option>pendente</option>
            <option>confirmado</option>
            <option>concluido</option>
            <option>cancelado</option>
          </select></label
        ><label
          >Desenho aprovado (JPG, PNG ou WEBP até 5 MB)<input
            id="desenho"
            type="file"
            class="form-control"
            accept="image/jpeg,image/png,image/webp" /></label
        ><button type="submit" class="btn btn-primary">
          Salvar agendamento</button
        ><button id="cancelar" type="button" class="btn btn-secondary" hidden>
          Cancelar edição
        </button>
      </form>
      <div class="table-responsive">
        <!-- A tabela é preenchida pelas chamadas Fetch à API -->
        <table class="table table-striped align-middle">
          <thead>
            <tr>
              <th>ID</th>
              <th>Data</th>
              <th>Hora</th>
              <th>Cliente</th>
              <th>Tatuador</th>
              <th>Descrição</th>
              <th>Valor</th>
              <th>Status</th>
              <th>Desenho</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="linhas"></tbody>
        </table>
      </div>
    </main>
    <!-- Carrega os scripts compartilhados antes da lógica desta tela -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/agendamentos.js"></script>
  </body>
</html>

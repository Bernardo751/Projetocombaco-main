<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Senioridade • Estúdio</title>
    <link href="css/vendor/bootstrap.min.css" rel="stylesheet" />
    <link href="css/atelier.css" rel="stylesheet" />
  </head>
  <body
    class="bg-light"
    data-recurso="senioridade"
    data-campo="nome"
    data-titulo="Senioridade"
  >
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="dashboard.html">Estúdio</a>
        <div>
          <a class="btn btn-sm btn-outline-light" href="dashboard.html"
            >Painel</a
          >
          <a class="btn btn-sm btn-outline-light" href="clientes.html"
            >Clientes</a
          >
          <a class="btn btn-sm btn-outline-light" href="senioridade.html"
            >Senioridade</a
          >
          <a class="btn btn-sm btn-outline-light" href="estilos.html"
            >Estilos</a
          >
          <a class="btn btn-sm btn-outline-light" href="tatuadores.html"
            >Tatuadores</a
          >
          <a class="btn btn-sm btn-outline-light" href="agendamentos.html"
            >Agendamentos</a
          >
          <button data-logout class="btn btn-sm btn-outline-light">Sair</button>
        </div>
      </div>
    </nav>
    <main class="container py-4">
      <h1>Senioridade</h1>
      <p id="aviso" class="text-danger"></p>
      <!-- Formulário da funcionalidade desta página -->
      <form id="form" class="d-flex gap-2 mb-4">
        <input
          id="valor"
          class="form-control"
          placeholder="Nome do nível"
          required
          maxlength="50"
        /><button type="submit" class="btn btn-primary">Cadastrar</button
        ><button id="cancelar" type="button" class="btn btn-secondary" hidden>
          Cancelar
        </button>
      </form>
      <!-- A tabela é preenchida pelas chamadas Fetch à API -->
      <table class="table table-striped">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="linhas"></tbody>
      </table>
    </main>
    <!-- Carrega os scripts compartilhados antes da lógica desta tela -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/catalogo.js"></script>
    <script src="js/senioridade.js"></script>
  </body>
</html>

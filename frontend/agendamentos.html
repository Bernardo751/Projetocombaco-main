```html
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamentos — Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand">Estúdio de Tatuagem</span>
      <div>
        <a href="clientes.html" class="text-light me-3">Clientes</a>
        <a href="senioridade.html" class="text-light me-3">Senioridade</a>
        <a href="tatuadores.html" class="text-light me-3">Tatuadores</a>
        <a href="agendamentos.html" class="text-light">Agendamentos</a>
      </div>
    </div>
  </nav>

  <h1>Agendamentos</h1>

  <!-- Formulário para cadastrar e editar agendamentos -->
  <form id="form-agendamento" class="row g-2 mt-2 mb-4">

    <div class="col-md-3">
      <select id="idcliente" class="form-select" required>
        <option value="">Cliente...</option>
      </select>
    </div>

    <div class="col-md-3">
      <select id="idtatuador" class="form-select" required>
        <option value="">Tatuador...</option>
      </select>
    </div>

    <div class="col-md-2">
      <input type="date" id="dataagendamento" class="form-control" required>
    </div>

    <div class="col-md-2">
      <input type="time" id="horaagendamento" class="form-control" required>
    </div>

    <div class="col-md-2">
      <input
        type="number"
        id="valortatuagem"
        class="form-control"
        placeholder="Valor (R$)"
        step="0.01"
        min="0"
      >
    </div>

    <div class="col-md-12">
      <textarea
        id="descricaotatuagem"
        class="form-control"
        placeholder="Descrição da tatuagem"
      ></textarea>
    </div>

    <!-- Campo para selecionar o desenho aprovado -->
    <div class="col-md-6">
      <label for="desenho" class="form-label">
        Desenho aprovado (imagem)
      </label>
      <input
        type="file"
        id="desenho"
        class="form-control"
        accept="image/jpeg,image/png,image/webp,image/gif"
      >
      <small class="text-muted">
        Formatos aceitos: JPG, PNG, WEBP e GIF. Máximo de 5 MB.
      </small>
    </div>

    <!-- Status aparece somente durante a edição -->
    <div class="col-md-3" id="bloco-status" style="display: none;">
      <label for="status" class="form-label">Status</label>
      <select id="status" class="form-select">
        <option value="pendente">Pendente</option>
        <option value="confirmado">Confirmado</option>
        <option value="concluido">Concluído</option>
        <option value="cancelado">Cancelado</option>
      </select>
    </div>

    <div class="col-md-3 d-flex align-items-end">
      <button
        id="btn-submit-agendamento"
        type="submit"
        class="btn btn-primary w-100"
      >
        Cadastrar
      </button>
    </div>

  </form>

  <!-- Tabela de agendamentos -->
  <div class="table-responsive">
    <table class="table table-bordered table-striped align-middle">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Cliente</th>
          <th>Tatuador</th>
          <th>Data</th>
          <th>Hora</th>
          <th>Valor</th>
          <th>Status</th>
          <th>Desenho</th>
          <th>Ações</th>
        </tr>
      </thead>

      <tbody id="corpo-tabela">
        <!-- Os agendamentos serão carregados pelo JavaScript -->
      </tbody>
    </table>
  </div>

  <script src="js/agendamentos.js"></script>

</body>
</html>
